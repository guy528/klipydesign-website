# KLIPYDESIGN.COM — site settings for GitHub Pages (Jekyll).
# GitHub builds the site automatically every time something is committed.
title: KLIPYDESIGN
url: https://klipydesign.com

# Each file in the _projects folder becomes a page at /projects/<file-name>/
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown

# Files kept in the repository but not published on the website
exclude:
  - tools
  - README.md
  - ADDING-PROJECTS.md
  - PROJECT-TEMPLATE.md
